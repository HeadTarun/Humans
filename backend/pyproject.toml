[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HeadTarun", email = "tarundangeengineer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "cachetools>=5.3.0",
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "geoip2>=4.8.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.32.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "tldextract>=5.3.2",
    "uvicorn[standard]>=0.52.4",
    "whoisit>=2.8.0",
    "torch",
    "transformers",
    "joblib",
    "scikit-learn",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
